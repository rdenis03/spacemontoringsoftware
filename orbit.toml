# ORBIT configuration.
# Which implementation fills each module slot, and its options.
# Paths are relative to this file. Keys ending in _path are file paths.

[mission]
name = "ORBIT demo mission"
# The daily assessment runs after the night's wearable data and the morning check-in.
assessment_hour_utc = 10

[storage]
database = "data/orbit.db"

[pipeline]
baseline_window_days = 14   # days of history that define "your normal"
recent_days = 3             # days compared against that normal
event_lookback_days = 7     # how far back stress events count

[comms]                     # M13
# One-way delay for packets queued to Earth: Moon about 0.02 (1.3 s), Mars 3-22.
one_way_delay_minutes = 20
# ORBIT queues a report for Earth by itself when an astronaut reaches this level
# ("yellow", "orange" or "red"), at most once per astronaut per day. "off" disables it.
auto_send_level = "orange"

# ---- Module slots ---------------------------------------------------------
# Change `use` to switch implementation. `python -m orbit modules` lists them.

[modules.baseline]          # M6
use = "rolling_median"
min_samples = 5

[modules.detector]          # M7
use = "robust_z"
threshold = 2.5
drift_threshold = 1.5
drift_days = 2

[modules.scorer]            # M8
use = "rule_based"

[modules.actions]           # M10
use = "protocol"            # ranks cards by how much of the score they explain
cards_path = "cards/action_cards.jsonl"   # hand-written library, checked on load
max_cards = 3
# Starter, kept as fallback:
# use = "card_library"
# cards_path = "examples/action_cards.jsonl"

[modules.sync]              # M13
use = "consent_gate"

# ---- Symptom triage (M15) ---------------------------------------------------
# The chat check-in: the astronaut's own words -> red-flag rules -> extractor
# -> reasoner -> up to 5 questions -> cards. Not part of the daily pipeline;
# `python -m orbit triage` and the API's /triage endpoints use it.

[triage]                      # M15
session_timeout_minutes = 120 # an open chat expires this long after its last turn
patterns_path = "cards/patterns.jsonl"
triage_cards_path = "cards/triage_cards.jsonl"   # never mixed into action_cards.jsonl
red_flags_path = "cards/red_flags.jsonl"

[triage.extractor]
use = "lexicon"
lexicon_path = "cards/symptom_lexicon.jsonl"

[triage.reasoner]
use = "rules"
questions_path = "cards/questions.jsonl"
max_questions = 5
stop_probability = 0.8

# ---- Data sources -----------------------------------------------------------
# Read in order by `python -m orbit ingest`.

[[sources]]
use = "files"
crew_path = "examples/crew.jsonl"
observations_path = "examples/observations.jsonl"
events_path = "examples/context_events.jsonl"

# Real NASA space weather (M5), replayed into the example mission. Onboard it
# only reads the cache; never the network. Real 2025-10-16 lands on mission
# day 70 (2027-03-14): a geomagnetic storm on day 72, a solar particle event on day 76.
# To refresh on the ground: mode = "fetch" (key from NASA_API_KEY, else DEMO_KEY).
[[sources]]
use = "donki"
mode = "cache"
cache_path = "examples/donki_cache.json"
real_start = "2025-10-16"
real_end = "2025-10-26"
mission_start = "2027-03-14"
include_cme = false   # 78 CMEs in this window alone; their effects show up as SEP/GST
include_flr = false   # the FLR endpoint answered 404 (2026-11-15); fields not checked live

