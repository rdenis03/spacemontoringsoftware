# Render blueprint for the ORBIT backend (free plan).
# Render → New → Blueprint → pick this repository.
# The free disk is not persistent: the SQLite database starts empty after each
# restart, and `serve` reloads the example data automatically.
services:
  - type: web
    name: orbit-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m orbit serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
